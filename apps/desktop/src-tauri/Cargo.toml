[package]
name = "jack-ai"
version = "0.1.0"
description = "JACK AI desktop"
authors = ["JACK AI"]
license = "Proprietary"
edition = "2021"
rust-version = "1.85"

[lib]
name = "jack_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "macros", "rt-multi-thread", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
getrandom = "0.4"
hex = "0.4"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "=2.10.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
